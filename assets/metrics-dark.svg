<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; }
    .border { stroke: #30363d; stroke-width: 1.5; fill: none; }
    .accent-grid { stroke: #A855F7; stroke-opacity: 0.25; stroke-width: 1; fill: none; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #A855F7; letter-spacing: 1.5px; }
    .subtext { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 12px; fill: #8b949e; }
    .tag { font-family: monospace; font-size: 11px; fill: #c9d1d9; }
  </style>

  <rect width="800" height="240" rx="8" class="bg" />
  <rect x="1" y="1" width="798" height="238" rx="7" class="border" />

  <!-- Subtle grid pattern -->
  <g class="accent-grid">
    <line x1="40" y1="80" x2="760" y2="80" />
    <line x1="40" y1="130" x2="760" y2="130" />
    <line x1="40" y1="180" x2="760" y2="180" />
  </g>

  <g transform="translate(400, 95)" text-anchor="middle">
    <text y="0" class="title">◈ 3D ISOMETRIC CONTRIBUTION CALENDAR ◈</text>
    <text y="30" class="subtext">Target Asset: assets/metrics-dark.svg</text>
    <text y="55" class="tag">Automated rendering via lowlighter/metrics workflow for Sidd1104</text>
  </g>
</svg>
