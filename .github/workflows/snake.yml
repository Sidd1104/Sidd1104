name: Contribution Snake Generator

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: profile-snake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Sidd1104
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23A855F7
            dist/snake-light.svg?palette=github-light&color_snake=%23A855F7

      - name: Deploy Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
