name: Profile Metrics Generator

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Isometric 3D Contribution Metrics (Dark Mode)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sidd1104
          filename: assets/metrics-dark.svg
          config_timezone: Asia/Kolkata
          config_theme: dark
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit

      - name: Generate Isometric 3D Contribution Metrics (Light Mode)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sidd1104
          filename: assets/metrics-light.svg
          config_timezone: Asia/Kolkata
          config_theme: light
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
